appId: gg.poro.companion
productName: Poro
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - nsis
  # Code signing: electron-builder signs automatically when the environment provides a certificate,
  # e.g. CSC_LINK=C:\certs\poro.pfx and CSC_KEY_PASSWORD=... (or WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD).
  # Without a certificate the installer is built unsigned and SmartScreen warns on first start.
  # Unsigned builds must not verify the signature of downloaded updates.
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  differentialPackage: true
# Auto-update feed: the generic provider expects latest.yml, the installer and its .blockmap in one folder.
# The URL here is a placeholder; the app uses the "Update-Adresse" from its settings at runtime.
publish:
  provider: generic
  url: https://updates.poro.invalid/
